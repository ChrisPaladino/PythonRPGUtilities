[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ker-nethalas-manager"
version = "0.1.0"
description = "Personal Ker Nethalas digital companion prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ker_nethalas.content" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
